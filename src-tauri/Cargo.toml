[package]
name = "asuna"
version = "0.1.0"
description = "Asuna — local-first, sesli kisisel AI companion (macOS)"
authors = ["Omer Gungor"]
license = "MIT"
repository = "https://github.com/omergungor11/asuna"
edition = "2021"
# Rust surumu `rust-toolchain.toml` ile pinlenir. Burada ayrica dil MSRV'si
# tutulur ki CI'da farkli bir toolchain kullanilirsa hata erken ciksin.
# 1.85: `reqwest 0.13` (ASU-011) bu surumu sart kosuyor.
rust-version = "1.85"

[lib]
# `_lib` soneki gereklidir: bin hedefi (`asuna`) ile lib adi Windows'ta
# cakisiyor — https://github.com/rust-lang/cargo/issues/8519
name = "asuna_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# ---------------------------------------------------------------------------
# Phase 0 bagimlilik politikasi: burada YALNIZCA Tauri kabugunu ayaga kaldirmak
# icin gereken minimum var. `tauri-plugin-*` paketleri (opener, fs, shell, sql)
# bilerek YOK — her plugin webview'e yeni bir komut yuzeyi acar ve Asuna'nin
# yetki modeli (PROJECT.md Bolum 7, 17, 19) her komutun tek tek gerekcelendirilmesini
# sart kosar. Ihtiyac dogduğu task'ta, capability dosyasiyla birlikte eklenir.
# SQLite erisim yolu ASU-005'te (OQ-1) kararlastirilacak — simdiden plugin eklenmedi.
# ---------------------------------------------------------------------------
tauri = { version = "2.11.5", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# --- ASU-011: ephemeral Realtime token minting -----------------------------
# Kalici `OPENAI_API_KEY` yalnizca bu process'te; OpenAI'ye giden tek HTTP
# cagrisi burada yapiliyor. Surum **exact** pinli: TLS/HTTP yuzeyi kendi
# kendine yukselmemeli (yeni bir minor surumun getirdigi davranis degisikligi
# secret tasiyan tek istegimizi etkiler). Yukseltme bilincli bir commit.
#
# Feature secimi (default kapali — her feature ayri bir kod yuzeyi):
#   rustls       : TLS. `default-tls` zaten reqwest 0.13'te rustls'e cozuluyor;
#                  acikca yazildi ki TLS backend'i tesadufen degismesin.
#                  (Platform sertifika dogrulayicisi: rustls-platform-verifier.)
#   json         : istek/yanit govdesi icin serde_json koprusu.
#   system-proxy : kurumsal ag arkasindaki kullanicida token uretimi sessizce
#                  patlamasin diye macOS sistem proxy ayari okunur.
# Bilerek KAPALI: http2 (tek kucuk POST icin gereksiz `h2` agaci),
# charset (yanit yalnizca JSON olarak okunuyor), cookies, blocking,
# multipart, stream, socks.
reqwest = { version = "=0.13.4", default-features = false, features = [
  "rustls",
  "json",
  "system-proxy",
] }
# Tipli hata varyantlari (PROJECT.md Bolum 30). Zaten agacta vardi; exact pinli.
thiserror = "=2.0.20"

# --- ASU-029: SQLite kalici depolama (ADR-005 secenek B) -------------------
# SQLite'a **yalnizca** bu process'ten erisilir; `tauri-plugin-sql` bilerek YOK
# (renderer'a ham SQL yuzeyi acardi, path sandbox'i olmazdi, transaction
# veremezdi — ADR-005 "Spike Bulgulari" A/1-9).
#
# Surumler **exact** pinli: bundled SQLite surumu (3.53.2) makineden ve
# macOS'tan bagimsiz, tekrarlanabilir olmali. Yukseltme bilincli bir commit.
#
# Feature secimi:
#   bundled : SQLite kaynagi crate ile derlenir. Sistem SQLite'ina bagimlilik
#             yok → surum surprizi yok, imzalama/notarization tarafinda ek
#             dylib yok. Ileride sifreleme icin tek degisiklik:
#             `bundled` → `bundled-sqlcipher` + acilista `PRAGMA key` (ADR-005).
# Bilerek KAPALI: `chrono`/`serde_json`/`uuid` tip koprulerinin hicbiri —
# donusum repository sinirinda elle yapilir, tip yuzeyi dar kalir.
rusqlite = { version = "=0.40.2", features = ["bundled"] }
# Migration'lar Rust'ta gomulu (`M::up(...).down(...)`), `PRAGMA user_version`
# ile izlenir, acilista `to_latest()` ile idempotent uygulanir (ADR-005 OQ-2).
# Ek sema tablosu yok; `down` gercekten calisir.
rusqlite_migration = "=2.6.0"
tauri-plugin-dialog = "2.7.2"

[dev-dependencies]
# ASU-029: ACL regresyon testi. `tauri::test::mock_builder` + `get_ipc_response`
# ile renderer'in gonderdigi `InvokeRequest`'in aynisi, **gercek** capability
# dosyalari uzerinden kosturulur. `test` feature'i yalnizca test hedeflerinde
# acilir; `cargo build`/`cargo tauri build` bu yuzeyi tasimaz.
tauri = { version = "=2.11.5", features = ["test"] }
# Yalnizca test icin: `#[tokio::test]`. Runtime'i tauri zaten tasiyor,
# burada ek olarak sadece test makrolari aciliyor. Gercek API'ye cikan test
# YOK — testler yerelde acilan bir TCP sunucusuna vurur (bkz. realtime_token.rs).
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread"] }

[profile.release]
# Surekli acik duran bir companion: binary boyutu ve bellek ayak izi urun kriteri.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

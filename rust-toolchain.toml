# Rust toolchain pini.
#
# Neden pinli: Tauri build'i ve `clippy -- -D warnings` gate'i toolchain surumune
# duyarli — yeni bir stable clippy'nin ekledigi lint, CI'yi ilgisiz bir anda
# kirmasin. Yukseltme bilincli bir commit olsun (asuna-docs/DECISIONS.md).
#
# 1.96.1: gelistirme makinesinde dogrulanan surum (macOS 26.5, Apple Silicon / aarch64).
# MSRV ayrica src-tauri/Cargo.toml icinde `rust-version` ile tutulur.
[toolchain]
channel = "1.96.1"
components = ["rustfmt", "clippy"]
targets = ["aarch64-apple-darwin"]
profile = "minimal"
